[workspace]
resolver = "2"
members = [
    "cactus-sys",
    "cactus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mrsarac/cactus-rs"
authors = ["Mustafa Saraç <mustafa@neurabytelabs.com>"]
keywords = ["ai", "llm", "inference", "on-device", "cactus"]
categories = ["api-bindings", "science"]

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
